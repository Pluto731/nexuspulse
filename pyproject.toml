[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexuspulse"
version = "0.1.0"
description = "Autonomous Tech Intelligence & Hybrid Retrieval Knowledge Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "numpy>=1.26.0",
    "edge-tts>=6.1.0",
    "pydub>=0.25.1",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
